name: Deploy Ecology Private Dashboard

on:
  push:
    branches:
      - main
    paths:
      - admin/**
      - .github/workflows/deploy-ecology-admin.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecologytreeservice-admin-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy locked dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 31d06642a08b1bd412f3339cc535179a
      PROJECT_NAME: ecologytreeservice-admin
      ADMIN_DOMAIN: admin.ecologytreeservice.com
      CF_ACCESS_AUD: ${{ secrets.ECOLOGY_CF_ACCESS_AUD }}
      CF_ACCESS_TEAM_DOMAIN: ${{ secrets.ECOLOGY_CF_ACCESS_TEAM_DOMAIN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install deployment tooling
        run: npm ci

      - name: Ensure isolated Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if ! npx wrangler pages project list --config admin/wrangler.jsonc | grep -q "$PROJECT_NAME"; then
            npx wrangler pages project create "$PROJECT_NAME" --production-branch main --config admin/wrangler.jsonc
          fi

      - name: Configure private API secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_API_SECRET: ${{ secrets.ECOLOGY_ADMIN_API_SECRET }}
        run: printf '%s' "$ADMIN_API_SECRET" | npx wrangler pages secret put ADMIN_API_SECRET --project-name "$PROJECT_NAME" --config admin/wrangler.jsonc

      - name: Configure Cloudflare Access verification
        if: ${{ env.CF_ACCESS_AUD != '' && env.CF_ACCESS_TEAM_DOMAIN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          printf '%s' "$CF_ACCESS_AUD" | npx wrangler pages secret put CF_ACCESS_AUD --project-name "$PROJECT_NAME" --config admin/wrangler.jsonc
          printf '%s' "$CF_ACCESS_TEAM_DOMAIN" | npx wrangler pages secret put CF_ACCESS_TEAM_DOMAIN --project-name "$PROJECT_NAME" --config admin/wrangler.jsonc

      - name: Deploy dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          npx wrangler pages deploy admin/public
          --project-name "$PROJECT_NAME"
          --branch main
          --commit-hash "$GITHUB_SHA"
          --config admin/wrangler.jsonc

      - name: Attach dedicated admin domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          domains="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME/domains")"
          if ! printf '%s' "$domains" | jq -e --arg domain "$ADMIN_DOMAIN" '.result[]? | select(.name == $domain)' >/dev/null; then
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"name\":\"$ADMIN_DOMAIN\"}" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME/domains" >/dev/null
          fi
